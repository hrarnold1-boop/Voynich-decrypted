<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNA-3LT // Proyecto Codex MS 408 — Manuscrito Voynich</title>
  <style>
    :root {
      --bg-obsidian: #030712;
      --bg-card: rgba(17, 24, 39, 0.85);
      --bg-input: #090d16;
      --border-subtle: rgba(255, 255, 255, 0.12);
      --cyan: #38bdf8;
      --indigo: #818cf8;
      --gold: #eab308;
      --emerald: #34d399;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-obsidian);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(3, 7, 18, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 20px;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(8, 51, 68, 0.6);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }
    .telemetry-top { font-size: 12px; color: var(--text-muted); }
    nav { display: flex; flex-wrap: wrap; gap: 8px; }
    nav a {
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      color: #e5e7eb;
      border: 1px solid var(--border-subtle);
      transition: 0.2s;
    }
    nav a:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--cyan); }
    nav a.btn-gold {
      background: linear-gradient(135deg, #eab308, #ca8a04);
      color: #030712;
      border: none;
    }

    /* LAYOUT */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .grid-motor {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    @media (min-width: 960px) {
      .grid-motor { grid-template-columns: 4fr 8fr; }
      .grid-2 { grid-template-columns: 1fr 1fr; }
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
    }
    .grid-2, .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* CARDS */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .card-cyan { border-color: rgba(56, 189, 248, 0.28); }
    .card-gold { border-color: rgba(234, 179, 8, 0.3); }

    .eyebrow {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--cyan);
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
    }
    .eyebrow-gold { color: var(--gold); }
    h2 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 12px; }
    h3 { font-size: 16px; font-weight: 700; color: var(--gold); margin-bottom: 8px; }

    /* FORM CONTROLS */
    .field-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    select, input, textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: var(--cyan); }

    .lang-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .lang-btn {
      padding: 10px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      transition: 0.2s;
    }
    .lang-btn.active {
      background: var(--cyan);
      color: #030712;
      border-color: var(--cyan);
    }

    .telemetry-box {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      font-size: 12px;
      margin-bottom: 18px;
    }
    .telemetry-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }
    .status-ok { color: var(--emerald); font-weight: 700; }

    .btn-primary {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      color: #030712;
      transition: 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }

    .btn-amber {
      display: inline-block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      background: var(--gold);
      color: #030712;
    }

    /* OUTPUT SCREEN */
    .output-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.12);
      color: var(--cyan);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .eva-box {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 18px;
      font-size: 13px;
      color: #d1d5db;
    }
    blockquote {
      font-size: 20px;
      font-weight: 300;
      color: #fff;
      line-height: 1.5;
      margin: 18px 0;
    }
    .triplet-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
    }
    .canvas-wrap {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
    }
    canvas {
      width: 100%;
      height: 120px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      display: block;
      margin-top: 8px;
    }

    /* SUBCARDS & FOLIO BUTTONS */
    .sub-card {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 18px;
    }
    .folio-quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    @media (min-width: 600px) {
      .folio-quick-grid { grid-template-columns: repeat(4, 1fr); }
    }
    .folio-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px;
      text-align: left;
      color: #fff;
      cursor: pointer;
    }
    .folio-btn:hover { border-color: var(--gold); }

    ul.clean-list {
      padding-left: 18px;
      color: #d1d5db;
      font-size: 13px;
    }
    ul.clean-list li { margin-bottom: 6px; }

    footer {
      border-top: 1px solid var(--border-subtle);
      background: #02050c;
      padding: 28px 16px;
      text-align: center;
      margin-top: 40px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <div class="badge-live mono">
          <span class="dot"></span>
          <span>CODEX MS 408 // v4.8-PROD</span>
        </div>
        <span class="telemetry-top mono">LATENCY: <strong style="color:#fff">0.038ms</strong> // TENSOR: <strong style="color:var(--indigo)">ISENTROPIC</strong></span>
      </div>
      <nav class="mono">
        <a href="#motor">MOTOR 3LT</a>
        <a href="#cosmologia">COSMOLOGÍA</a>
        <a href="#repositorios">ZENODO & FOLIOS</a>
        <a href="#fundacion">FUNDACIÓN RAF</a>
        <a href="#contacto" class="btn-gold">CONTACTO</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- SECCIÓN 1: MOTOR TENSOR Y DECODIFICACIÓN -->
    <section id="motor" class="grid-motor">
      <!-- CONTROL MATRIX -->
      <div class="card card-cyan">
        <span class="eyebrow mono">Workspace Engine</span>
        <h2>Control Matrix</h2>

        <div class="field-group">
          <label class="mono">Sección del Manuscrito</label>
          <select id="sectionFilter" class="mono">
            <option value="ALL">Todas las Secciones (Corpus Completo)</option>
            <option value="ROSETTA">Clave Rosetta & Recetas (ff. 103r–116v)</option>
            <option value="BOTANICAL">Herbario / Botánica (ff. 1r–66v)</option>
            <option value="ASTRONOMICAL">Astronómica & Zodiacal (ff. 67r–73v)</option>
